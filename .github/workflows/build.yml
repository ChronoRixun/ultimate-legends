name: Build

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  # "**": a PR into a branch with a "/" in its name (integration/0.4.0) builds too ("*" stops at the "/").
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-2022
    permissions:
      contents: write   # the release step on v* tags; everything else only reads
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release
    steps:
      - name: Set Git to use LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out files
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # premake derives the version from git history

      # What a release tag publishes (stable, or a -beta.<n> / -rc.<n> pre-release), its version and notes:
      # the package and publish steps below use the same script.
      - name: Release tag logic self-test
        run: python tools/release_tag.py --self-test

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      # Tag checkouts are detached HEAD; pin the branch name premake writes into the version header.
      - name: Pin branch name for tag builds
        if: startsWith(github.ref, 'refs/tags/v')
        run: git switch --force-create main

      # CEF is a 260 MB download; premake skips it when deps/cef already has the right version.
      - name: Cache CEF
        uses: actions/cache@v6
        with:
          path: deps/cef
          key: cef-${{ hashFiles('deps/premake/cef.lua') }}

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Build ${{ matrix.configuration }}
        run: msbuild /m /v:minimal /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 build/ultimate-legends.sln

      # (A time limit: a test that hangs - a lock taken twice, say - fails the job instead of stalling it.)
      - name: Unit tests
        timeout-minutes: 5
        run: build/bin/x64/${{ matrix.configuration }}/ultimate-legends-tests.exe

      # The launcher UI's (src/tests/ui): the real scripts on a small DOM, a fake clock and a fake backend.
      - name: UI tests
        timeout-minutes: 5
        run: |
          node --version
          node src/tests/ui/run.js

      - name: Upload ${{ matrix.configuration }} binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.configuration }} binary
          path: |
            build/bin/x64/${{ matrix.configuration }}/ultimate-legends.exe
            build/bin/x64/${{ matrix.configuration }}/ultimate-legends.pdb

      - name: Upload ${{ matrix.configuration }} CEF runtime
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.configuration }} CEF runtime
          path: build/runtime/x64/${{ matrix.configuration }}/cef

      - name: Upload launcher UI
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: Launcher UI
          path: src/launcher-ui

      # The portable zip (tools/package-portable.ps1): exe + ultimate-legends\{portable.marker, data\cef, data\launcher-ui}.
      # Every run uploads it as an artifact; a v* tag also publishes it as a GitHub release. A tag's version is the tag
      # without its "v", suffix included (v0.5.0-beta.1 -> ultimate-legends-0.5.0-beta.1-win64-portable.zip); a tag
      # that is neither stable nor -beta.<n> / -rc.<n> stops here (tools/release_tag.py).
      - name: Package portable zip
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = python tools/release_tag.py $env:GITHUB_REF_NAME | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $tag) { throw "not a release tag: $env:GITHUB_REF_NAME" }
            $version = $tag.version
          } else {
            $version = "0.0.0-$($env:GITHUB_SHA.Substring(0, 8))"
          }
          tools/package-portable.ps1 -Version $version

      - name: Upload portable zip
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: Portable zip
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: matrix.configuration == 'Release' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # tools/release_tag.py: a stable tag (v0.4.0) publishes as before - the latest release, its notes
        # docs/release/<tag>-notes.md when the release has one (written with its changelog entry), else the generic line.
        # A -beta.<n> / -rc.<n> tag (v0.5.0-beta.1) publishes a pre-release that is never the latest (Stable,
        # releases/latest, never sees it; the Beta update channel does), with the same asset names, and its notes are
        # docs/release/v<base>-notes.md (v0.5.0-notes.md) under a "Beta - test build" banner.
        run: |
          $tag = python tools/release_tag.py $env:GITHUB_REF_NAME --notes-out build/release-notes.md | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $tag) { throw "not a release tag: $env:GITHUB_REF_NAME" }
          $channel = if ($tag.prerelease) { @('--prerelease', '--latest=false') } else { @() }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*.zip).FullName dist/SHA256SUMS.txt --title $tag.title --notes-file build/release-notes.md @channel
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
